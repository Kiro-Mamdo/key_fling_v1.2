<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>แจกสคริปต์</title>
<style>
:root{
  --white:#fff;
  --black:#111;
  --gray:#d9d9d9;
  --gray2:#bcbcbc;
  --red:#e53935;
  --red2:#ff4d49;
  --shadow:0 12px 32px rgba(0,0,0,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--black)}
body{overflow:hidden;background:#fff}
button,input,textarea{font:inherit}
button{border:0;cursor:pointer}
.app{width:100%;height:100%;position:relative}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:flex}

/* HOME */
#home{background:#fff;align-items:center;justify-content:center}
.home-wrap{
  width:min(92vw,620px);
  text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:18px
}
.home-title{font-size:clamp(24px,6vw,38px);font-weight:800;line-height:1.2}
.youtube-link{
  display:inline-flex;align-items:center;gap:9px;color:#111;text-decoration:none;
  font-size:18px;font-weight:700
}
.yt-icon{
  width:34px;height:24px;border-radius:7px;background:#ff0000;display:grid;place-items:center;position:relative;
  box-shadow:0 4px 10px rgba(255,0,0,.20)
}
.yt-icon:before{
  content:"";width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:9px solid #fff;margin-left:2px
}
.plus{
  position:absolute;left:50%;bottom:28px;transform:translateX(-50%);
  width:74px;height:74px;border-radius:50%;background:#111;color:#fff;
  font-size:42px;line-height:74px;box-shadow:var(--shadow)
}
.plus:active,.fab:active,.primary:active,.copy-btn:active{transform:scale(.96)}
.account-fab{
  position:absolute;right:18px;top:18px;width:52px;height:52px;border-radius:50%;
  background:#ededed;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.12)
}
.account-fab img{width:100%;height:100%;object-fit:cover;display:block}

/* BUILDER */
#builder{background:#bcbcbc;align-items:center;justify-content:center;padding:18px}
.card{
  width:min(94vw,680px);max-height:94vh;overflow:auto;background:#d0d0d0;padding:20px;
  box-shadow:var(--shadow);border:1px solid #adadad
}
.card h2{margin:0 0 14px;font-size:24px}
.label{font-size:16px;font-weight:800;margin:14px 0 7px;display:block}
.field{
  width:100%;border:2px solid #8f8f8f;background:#efefef;border-radius:0;padding:13px 14px;
  outline:none;color:#111
}
.field:focus{border-color:#333}
textarea.field{height:160px;resize:vertical;min-height:120px}
.small-note{font-size:13px;color:#333;margin-top:7px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.primary{
  width:100%;padding:15px;background:#111;color:#fff;margin-top:18px;font-weight:800
}
.back-btn{
  background:transparent;color:#111;padding:5px 0;font-weight:700;margin-bottom:6px
}
.link-box{
  margin-top:14px;background:#ececec;border:2px solid #8f8f8f;padding:11px;display:flex;gap:8px;align-items:center
}
.link-value{flex:1;overflow:auto;white-space:nowrap;font-size:13px}
.copy-mini{background:#111;color:#fff;padding:9px 12px}

/* RESULT / GENERATED SHARE PAGE */
#share{background:#fff;align-items:center;justify-content:center}
.share-wrap{width:min(94vw,700px)}
.share-user{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.avatar{width:48px;height:48px;border-radius:50%;background:#bcbcbc;object-fit:cover}
.username{font-weight:800;font-size:18px}
.script-card{
  border:2px solid #d4d4d4;background:#fff;box-shadow:0 10px 24px rgba(0,0,0,.08)
}
.script-card-head{padding:15px 16px;border-bottom:2px solid #eee;font-weight:800;font-size:22px}
.timer-zone{padding:18px}
.timer{
  min-height:170px;border:2px solid #999;background:#eee;display:grid;place-items:center;
  text-align:center;padding:20px
}
.timer-number{font-size:48px;font-weight:900}
.timer-text{margin-top:7px;font-size:15px}
.action-row{display:flex;gap:10px;margin-top:12px}
.action-btn{flex:1;padding:14px;font-weight:800}
.get-btn{background:#111;color:#fff}
.copy-btn{background:var(--red);color:#fff}
.copy-btn:hover{background:var(--red2)}
.script-output{display:none}
.script-output.open{display:block}
.script-output textarea{
  width:100%;height:220px;border:0;outline:0;resize:none;padding:14px;background:#fff;color:#111
}
.direct-copy{
  background:var(--red);color:#fff;padding:10px 14px;position:absolute;right:8px;top:8px;font-weight:900
}
.output-wrap{position:relative}
.meta-url{font-size:12px;color:#666;margin-top:10px;word-break:break-all}

/* ACCOUNT */
.modal{
  position:absolute;inset:0;background:rgba(0,0,0,.28);display:none;align-items:flex-end;justify-content:center
}
.modal.open{display:flex}
.sheet{
  width:100%;max-width:680px;background:#fff;padding:18px 18px 28px;border-radius:22px 22px 0 0;
  box-shadow:0 -12px 35px rgba(0,0,0,.18)
}
.sheet h3{margin:0 0 14px}
.profile-line{display:flex;align-items:center;gap:14px}
.profile-preview{width:74px;height:74px;border-radius:50%;background:#bcbcbc;object-fit:cover;border:2px solid #ddd}
.file-label{display:inline-block;background:#111;color:#fff;padding:11px 14px;font-weight:800}
.close{background:#eee;color:#111;padding:10px 14px}
.sheet .actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.name-input{flex:1;min-width:180px}

/* TOAST */
#toast{
  position:absolute;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);
  background:#111;color:#fff;padding:11px 16px;opacity:0;pointer-events:none;transition:.22s;
  font-size:14px;z-index:1000
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:520px){
  .row{grid-template-columns:1fr}
  .card{padding:16px}
  .timer{min-height:145px}
}
</style>
</head>
<body>
<div class="app">

  <section id="home" class="screen active">
    <div class="home-wrap">
      <div class="home-title">เข้ามาทางลิงค์โดยตรงหรือกดปุ่มบวกเพื่อสร้างเว็บแจกสคริปของตนเอง</div>
      <a class="youtube-link" href="https://www.youtube.com/@BHK2Mambo" target="_blank" rel="noopener">
        <span class="yt-icon"></span><span>YouTube:BHK2 Mambo</span>
      </a>
    </div>
    <button class="account-fab" id="openAccount" aria-label="บัญชี">
      <img id="homeAvatar" alt="โปรไฟล์">
    </button>
    <button class="plus" id="openBuilder" aria-label="สร้างเว็บ">+</button>
  </section>

  <section id="builder" class="screen">
    <div class="card">
      <button class="back-btn" id="backHome">← กลับหน้าแรก</button>
      <h2>สร้างเว็บแจกสคริป</h2>

      <label class="label">ชื่อสคริป</label>
      <input id="scriptName" class="field" type="text" autocomplete="off">

      <label class="label">เมื่อรอครบ 5 วิแล้วจะได้สคริปต์อะไร</label>
      <textarea id="scriptCode" class="field"></textarea>

      <div class="row">
        <div>
          <label class="label">เวลารอ (วินาที)</label>
          <input id="waitSeconds" class="field" type="number" min="1" value="5">
        </div>
        <div>
          <label class="label">ชนิดลิงก์</label>
          <input class="field" type="text" value="ใช้ลิงก์เว็บปัจจุบัน" disabled>
        </div>
      </div>

      <button class="primary" id="createPage">สร้างเว็บแจกสคริป</button>

      <div id="generatedBox" class="link-box" style="display:none">
        <div class="link-value" id="generatedLink"></div>
        <button class="copy-mini" id="copyGenerated">Copy</button>
      </div>
      <div class="small-note">ระบบจะสร้างรหัสเฉพาะให้กับหน้านี้ และบันทึกข้อมูลไว้ในเครื่องนี้ด้วย</div>
    </div>
  </section>

  <section id="share" class="screen">
    <div class="share-wrap">
      <div class="share-user">
        <img class="avatar" id="shareAvatar" alt="โปรไฟล์">
        <div>
          <div class="username" id="shareUsername"></div>
          <div style="font-size:13px;color:#777">เว็บแจกสคริป</div>
        </div>
      </div>

      <div class="script-card">
        <div class="script-card-head" id="shareTitle"></div>
        <div class="timer-zone">
          <div class="timer" id="timerBox">
            <div>
              <div class="timer-number" id="timerNumber">5</div>
              <div class="timer-text">รอให้ครบเวลา แล้วกด “เอา script”</div>
            </div>
          </div>
          <div class="action-row">
            <button class="action-btn get-btn" id="getScriptBtn">เอา script</button>
            <button class="action-btn copy-btn" id="copyScriptBtn">Copy</button>
          </div>
          <div class="script-output" id="scriptOutput">
            <div class="output-wrap">
              <button class="direct-copy" id="directCopy">Copy</button>
              <textarea id="outputCode" readonly></textarea>
            </div>
          </div>
          <div class="meta-url" id="shareUrl"></div>
        </div>
      </div>
    </div>
  </section>

  <div class="modal" id="accountModal">
    <div class="sheet">
      <h3>บัญชี</h3>
      <div class="profile-line">
        <img id="profilePreview" class="profile-preview" alt="โปรไฟล์">
        <div style="flex:1">
          <div style="font-weight:800;margin-bottom:7px">ชื่อ</div>
          <input id="displayName" class="field name-input" type="text" autocomplete="off">
          <div style="margin-top:10px">
            <label class="file-label" for="avatarFile">เลือกรูปจากแกลอรี่</label>
            <input id="avatarFile" type="file" accept="image/*" hidden>
          </div>
        </div>
      </div>
      <div class="actions">
        <button class="primary" id="saveAccount" style="margin-top:0">บันทึก</button>
        <button class="close" id="closeAccount">ปิด</button>
        <button class="close" id="randomName">สุ่มชื่อใหม่</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script>
(() => {
  const DEFAULT_AVATAR = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
      <rect width="200" height="200" fill="#bcbcbc"/>
      <circle cx="100" cy="76" r="42" fill="#777"/>
      <path d="M30 185c9-48 37-70 70-70s61 22 70 70" fill="#777"/>
    </svg>
  `);

  const names = [
    'ShadowFox','PixelBoy','BHKPlayer','ScriptKid','NightCore','MamboX',
    'RedWolf','BlueGhost','DarkByte','MoonDev','ZeroX','NeoPlayer',
    'KiroX','FireByte','GhostDev','AlphaX','Nova','RexDev','ByteZ','LunaX'
  ];

  const $ = id => document.getElementById(id);
  const state = {
    username: localStorage.getItem('sc_username') || names[Math.floor(Math.random()*names.length)],
    avatar: localStorage.getItem('sc_avatar') || DEFAULT_AVATAR
  };

  function saveProfile(){
    localStorage.setItem('sc_username', state.username);
    localStorage.setItem('sc_avatar', state.avatar);
  }

  function refreshProfileUI(){
    $('homeAvatar').src = state.avatar;
    $('profilePreview').src = state.avatar;
    $('displayName').value = state.username;
  }
  refreshProfileUI();
  saveProfile();

  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
  }

  function toast(msg){
    const t=$('toast');
    t.textContent=msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),1700);
  }

  function randomCode(len=12){
    const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
    const arr=new Uint32Array(len);
    crypto.getRandomValues(arr);
    let s='';
    for(let i=0;i<len;i++) s += chars[arr[i]%chars.length];
    return s;
  }

  function currentBaseUrl(){
    return location.href.split('#')[0].split('?')[0];
  }

  function makeShareUrl(id){
    return currentBaseUrl() + '#script=' + encodeURIComponent(id);
  }

  function loadPages(){
    try { return JSON.parse(localStorage.getItem('sc_pages') || '{}'); }
    catch(e){ return {}; }
  }
  function savePages(p){ localStorage.setItem('sc_pages', JSON.stringify(p)); }

  function createPageData(){
    const name = $('scriptName').value.trim();
    const code = $('scriptCode').value;
    const wait = Math.max(1, Math.min(3600, Number($('waitSeconds').value)||5));
    if(!name){ toast('กรุณาใส่ชื่อสคริป'); return null; }
    if(!code.trim()){ toast('กรุณาใส่สคริปต์'); return null; }

    const pages=loadPages();
    let id;
    do { id = randomCode(14) } while(pages[id]);
    pages[id]={
      id,name,code,wait,username:state.username,avatar:state.avatar,
      createdAt:Date.now()
    };
    savePages(pages);
    return pages[id];
  }

  function renderShare(data){
    showScreen('share');
    $('shareTitle').textContent = data.name;
    $('shareUsername').textContent = data.username;
    $('shareAvatar').src = data.avatar || DEFAULT_AVATAR;
    $('shareUrl').textContent = makeShareUrl(data.id);
    $('scriptOutput').classList.remove('open');
    $('outputCode').value = '';
    $('timerNumber').textContent = String(data.wait);
    $('getScriptBtn').disabled = false;
    $('getScriptBtn').style.opacity = '1';

    let remaining=data.wait;
    let timerId=null;
    const tick=()=>{
      $('timerNumber').textContent=String(remaining);
      if(remaining<=0){
        clearInterval(timerId);
        $('timerNumber').textContent='✓';
        $('getScriptBtn').disabled=false;
        $('getScriptBtn').style.opacity='1';
        $('getScriptBtn').dataset.ready='1';
      }else{
        remaining--;
      }
    };
    $('getScriptBtn').dataset.ready='0';
    $('getScriptBtn').onclick=()=>{
      if($('getScriptBtn').dataset.ready!=='1'){ toast('กรุณารอให้ครบเวลา'); return; }
      $('outputCode').value=data.code;
      $('scriptOutput').classList.add('open');
      toast('แสดงสคริปต์แล้ว');
    };

    timerId=setInterval(tick,1000);
    tick();

    const copyFn=async()=>{
      const txt=$('outputCode').value;
      if(!txt){ toast('กดเอา script ก่อน'); return; }
      try{
        await navigator.clipboard.writeText(txt);
        toast('คัดลอก script แล้ว');
      }catch(e){
        $('outputCode').select();
        document.execCommand('copy');
        toast('คัดลอก script แล้ว');
      }
    };
    $('copyScriptBtn').onclick=copyFn;
    $('directCopy').onclick=copyFn;
  }

  // Buttons
  $('openBuilder').onclick=()=>showScreen('builder');
  $('backHome').onclick=()=>showScreen('home');
  $('createPage').onclick=()=>{
    const data=createPageData();
    if(!data) return;
    const url=makeShareUrl(data.id);
    $('generatedBox').style.display='flex';
    $('generatedLink').textContent=url;
    history.replaceState(null,'',url);
    toast('สร้างเว็บแจกสคริปสำเร็จ');
  };
  $('copyGenerated').onclick=async()=>{
    const txt=$('generatedLink').textContent;
    try{await navigator.clipboard.writeText(txt)}catch(e){
      const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
    }
    toast('คัดลอกลิงก์แล้ว');
  };

  // Account
  $('openAccount').onclick=()=>{ refreshProfileUI(); $('accountModal').classList.add('open'); };
  $('closeAccount').onclick=()=>$('accountModal').classList.remove('open');
  $('randomName').onclick=()=>{
    state.username = names[Math.floor(Math.random()*names.length)] + Math.floor(Math.random()*100);
    refreshProfileUI();
    toast('สุ่มชื่อใหม่แล้ว');
  };
  $('saveAccount').onclick=()=>{
    const n=$('displayName').value.trim();
    if(n) state.username=n;
    saveProfile(); refreshProfileUI(); $('accountModal').classList.remove('open');
    toast('บันทึกโปรไฟล์แล้ว');
  };
  $('avatarFile').onchange=(e)=>{
    const file=e.target.files?.[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{ state.avatar=reader.result; refreshProfileUI(); };
    reader.readAsDataURL(file);
  };

  // Open direct share URL: #script=ID
  function boot(){
    const hash=location.hash;
    const m=hash.match(/script=([^&]+)/);
    if(m){
      const id=decodeURIComponent(m[1]);
      const pages=loadPages();
      const data=pages[id];
      if(data){ renderShare(data); return; }
      toast('ไม่พบเว็บแจกสคริปนี้ในเครื่องนี้');
    }
  }
  boot();
})();
</script>
</body>
</html>
